<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qəbul İmtahanına Sayğac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .exam-date {
            color: #764ba2;
            font-size: 1.3em;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .time-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px 15px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
        }

        .time-value {
            color: white;
            font-size: 3em;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .time-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1em;
            margin-top: 10px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .motivation {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 40px;
            font-size: 1.2em;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .exam-date {
                font-size: 1.1em;
            }

            .time-value {
                font-size: 2.5em;
            }

            .countdown {
                gap: 15px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📚</div>
        <h1>Qəbul İmtahanına Sayğac</h1>
        <div class="exam-date">7 Mart 2027, Saat 10:00</div>
        
        <div class="countdown">
            <div class="time-box">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Gün</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">0</span>
                <span class="time-label">Saat</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">0</span>
                <span class="time-label">Dəqiqə</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">0</span>
                <span class="time-label">Saniyə</span>
            </div>
        </div>

        <div class="motivation">
            ✨ Hər gün bir addımdır! Uğurlar diləyirik! ✨
        </div>
    </div>

    <script>
        const examDate = new Date('2027-03-07T10:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = examDate - now;

            if (distance < 0) {
                document.querySelector('.countdown').innerHTML = '<div style="grid-column: 1/-1; font-size: 2em; color: #667eea; font-weight: bold;">🎉 İmtahan günü gəlib çatdı! Uğurlar! 🎉</div>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
